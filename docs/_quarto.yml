project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!pdf.qmd"
  resources:
    - images/posit-logo.svg

website:
  title: "positron-server-ood"
  description: "Run Positron Server as an Open OnDemand interactive app"
  page-navigation: true
  page-footer:
    center: |
      Proudly supported by
      [![](images/posit-logo.svg){fig-alt="Posit PBC" width=65px}](https://posit.co/)
  navbar:
    background: light
    pinned: true
    left:
      - text: "Get started"
        file: get_started.qmd
      - text: "Configuration"
        file: configuration.qmd
      - text: "Troubleshooting"
        file: troubleshooting.qmd
      - text: "Test checklist"
        file: test_checklist.qmd
    right:
      - icon: github
        href: https://github.com/posit-dev/positron-server-ood
        aria-label: positron-server-ood GitHub

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    syntax-highlighting: arrow-light
